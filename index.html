<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub — Eventi sportivi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="site-header">
        <!-- Titolo dell'app + form di ricerca -->
        <h1>SportsHub</h1>
        <p>Cerca una squadra, scopri prossime partite e ultimi risultati.</p>
        <form id="ricercaForm" class="d-flex gap-2 col-12 col-md-9 col-lg-6 mx-auto">
            <input type="text" id="inputRicerca" class="form-control" placeholder="es. Arsenal, Lakers, Real Madrid..."
                required>
            <button type="submit" class="btn btn-light col-2">Cerca</button>
        </form>
    </header>

    <main class="container">

        <section id="preferiti-section">
            <h2>⭐️ Le tue squadre preferite</h2>
            <p>Non hai ancora salvato nessuna squadra. Cercane una qui sopra e aggiungila ai preferiti.</p> 

        </section>

        <section id="risultati-section">
            <!-- Spinner, errore, lista risultati ricerca squadre -->
            <h2>Squadre trovate</h2>
            
            <div id="listaRisultati" class="row g-3">
                <p>Inizia cercando una squadra qui sopra.</p>
            </div>



        </section>

        <section id="dettagli-section" hidden>
            <!-- Visibile dopo click su una squadra: prossimi eventi + ultimi risultati -->
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
